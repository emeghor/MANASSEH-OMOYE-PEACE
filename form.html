<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manasseh Omoye Peace</title>
    <style>
         .feedbackv-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .feedbackv-container h2 {
            color: #333;
            margin-bottom: 8px;
            text-align: center;
        }

        .feedbackv-container p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }

        .formv-group {
            margin-bottom: 18px;
        }

        .formv-group label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        .formv-group input, 
        .formv-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .formv-group input:focus, 
        .formv-group textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .status-msg.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .statuvs-msg.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }



    </style>


<body>
<center>
 <div class="feedbackv-container">
        <h2>Book a Session with us</h2>
        <p>Please fill out the form below.</p>
        
        <form id="feedbackvForm">
            
            <div class="formv-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>

            <div class="formv-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>

            <div class="formv-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" required placeholder="+1234567890">
            </div>

            <div class="formv-group">
                <label for="address">Address *</label>
                <input type="text" id="address" required placeholder="123 Main St, City, Country">
            </div>

            <div class="formv-group">
                <label for="message">Your Message *</label>
                <textarea id="message" rows="5" required placeholder="Book a Session with us..."></textarea>
            </div>

            <button type="submit" id="submitBtn">Book Session</button>
        </form>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- Firebase SDK (v10 Modular via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // =========================================================
        // Replace with your actual Firebase Configuration keys
        // =========================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Handle Form Submission
        const form = document.getElementById('feedbackForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Disable button during submission
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";
            statusMsg.className = "status-msg";
            statusMsg.innerText = "";

            // Collect form data
            const feedbackData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                message: document.getElementById('message').value,
                timestamp: new Date().toISOString()
            };

            try {
                // Save entry under the "feedbacks" node in Realtime Database
                const feedbackRef = ref(database, 'feedbacks');
                await push(feedbackRef, feedbackData);

                // Show success message and reset form
                statusMsg.className = "status-msg success";
                statusMsg.innerText = "Thank you! Your feedback has been received.";
                form.reset();
            } catch (error) {
                console.error("Error saving feedback:", error);
                statusMsg.className = "status-msg error";
                statusMsg.innerText = "Failed to submit feedback. Please try again.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Feedback";
            }
        });
    </script>

    </section>
</center>
</section>
</body>
