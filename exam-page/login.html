<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - School Portal</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f7f6; color: #333; }
    .container { max-width: 420px; margin: 60px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 20px; color: #0056b3; text-align: center; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; font-size: 15px; }
    button { background-color: #0056b3; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .footer-link { text-align: center; font-size: 14px; margin-top: 15px; }
    .footer-link a { color: #0056b3; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Account Login</h2>
    
    <label style="font-size: 13px; font-weight: bold;">Email Address</label>
    <input type="email" id="login-email" placeholder="Enter your email">

    <label style="font-size: 13px; font-weight: bold;">Password</label>
    <input type="password" id="login-password" placeholder="Enter password">

    <button onclick="loginUser()">Log In</button>

    <div class="footer-link">
      Don't have an account? <a href="register.html">Register here</a>
      <br><br>
      <a href="index.html" style="color:#6c757d;">← Back to Main Portal</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.loginUser = async () => {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) return alert("Please fill in both email and password.");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("Login successful!");
        window.location.href = "index.html";
      } catch (err) {
        alert("Login Failed: " + err.message);
      }
    };
  </script>
</body>
</html>
